# フォーク最小 CI（#910 Tier 1 / #911 Tier 2）
#
# 本家前提の巨大 CI は削除済み（commit 4e0be20aa0）。フォークに必要な最小限だけを回す:
#   - fork-spec  … spec/fork の巻き戻り検知ガード（#909）を自動ゲート化            [Tier 1]
#   - eslint     … 変更 JS/TS のみ ESLint（#904 の lint 負債の再発防止）           [Tier 1]
#   - stylelint  … 変更 CSS/SCSS のみ stylelint（uppercase 恒久禁止 #906 を担保）   [Tier 2]
#   - rubocop    … 変更 Ruby のみ RuboCop                                          [Tier 2]
#
# 変更ファイル抽出は changes ジョブに集約し、各 lint ジョブが outputs を参照する。
# Tier 3（通しアセットビルド・広域 rspec）は重いため nightly / 手動の別ワークフローに分離する。
name: Fork CI

on:
  push:
    branches:
      - 'work/4.6/**'
      - 'stable/**'
      - bshockdon
      - curesta
      - delmulin
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # フォーク独自拡張値の巻き戻り検知（#909）。rails_helper 経由で Rails を起動するため
  # PostgreSQL に加え Redis も必須（spec/rails_helper.rb の after フックが redis を触る）。
  fork-spec:
    name: spec/fork (巻き戻り検知ガード)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASS: postgres
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      # ネイティブ拡張ビルド（idn-ruby/charlock_holmes）と Rails 起動時の libvips ロードに必要
      # （upstream の setup-ruby 準拠: libicu-dev libidn11-dev libvips42）。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libicu-dev libidn11-dev libvips42

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run fork guard spec
        run: bundle exec rspec spec/fork

  # 変更ファイルを種別ごとに抽出して後続 lint ジョブへ渡す（push/PR 双方に対応）。
  changes:
    name: 変更ファイル抽出
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.collect.outputs.js }}
      css: ${{ steps.collect.outputs.css }}
      rb: ${{ steps.collect.outputs.rb }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed files by type
        id: collect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            # 新規ブランチ初回 push 等で before が全0の場合は親コミットを基準にする
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD^ HEAD"
            else
              range="${before} ${{ github.sha }}"
            fi
          fi
          changed() { git diff --name-only --diff-filter=ACMR $range -- "$@" | tr '\n' ' '; }
          js=$(changed '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs')
          css=$(changed '*.css' '*.scss')
          rb=$(changed '*.rb')
          echo "js=$js"   >> "$GITHUB_OUTPUT"
          echo "css=$css" >> "$GITHUB_OUTPUT"
          echo "rb=$rb"   >> "$GITHUB_OUTPUT"
          echo "JS/TS : ${js:-(なし)}"
          echo "CSS   : ${css:-(なし)}"
          echo "Ruby  : ${rb:-(なし)}"

  # 変更された JS/TS のみ ESLint（#904）。
  eslint:
    name: ESLint (変更ファイルのみ)
    needs: changes
    if: needs.changes.outputs.js != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint:js ${{ needs.changes.outputs.js }}

  # 変更された CSS/SCSS のみ stylelint（テーマ SCSS の uppercase 恒久禁止 #906 を担保）。
  stylelint:
    name: stylelint (変更ファイルのみ)
    needs: changes
    if: needs.changes.outputs.css != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn stylelint ${{ needs.changes.outputs.css }}

  # 変更された Ruby のみ RuboCop。--force-exclusion で .rubocop.yml の除外を尊重。
  rubocop:
    name: RuboCop (変更ファイルのみ)
    needs: changes
    if: needs.changes.outputs.rb != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libicu-dev libidn11-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop --force-exclusion ${{ needs.changes.outputs.rb }}
