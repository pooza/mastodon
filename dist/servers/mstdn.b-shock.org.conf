server {
  listen 80;
  listen [::]:80;
  server_name mstdn.b-shock.org;
  access_log syslog:server=localhost,tag=nginx_mstdn,severity=info combined_masked;
  location /.well-known/acme-challenge/ {
    root /usr/local/www/nginx;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mstdn.b-shock.org;
  access_log syslog:server=localhost,tag=nginx_mstdn,severity=info combined_masked;

  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_certificate /usr/local/etc/letsencrypt/live/mstdn.b-shock.org/fullchain.pem;
  ssl_certificate_key /usr/local/etc/letsencrypt/live/mstdn.b-shock.org/privkey.pem;
  add_header Strict-Transport-Security max-age=63072000;

  # pooza/chubo2#118 — robots.txt を無視するクローラを UA で落とす（2026-09-20 実測）。
  # ⚠ ExaSearchBot は Disallow を配った翌朝に robots.txt を 200 で取得してから、
  #   禁止した /packs/* を各 27,627 回取り続けた。10 時間で 564 万 req・101 GB 送出。
  #   ⚠⚠ 送信元は借り物の /24（IP リース業者・個人名義）で日ごとに入れ替わるため、
  #      IP 遮断は追いかけになる。UA で落とすほうが当たる。
  # ⚠ Meta は「協力しない」という判断（chubo2 docs/infra-common.md）。
  #   facebookexternalhit も robots.txt を取得したうえで / を 3 分おきに取り続けていた。
  #   ⚠⚠ FB / Instagram / WhatsApp へ URL を貼ったときのプレビューが壊れる。承知のうえ。
  # ⚠ 対象は「自分から名乗っている相手」だけ。Chrome 偽装型（2026-08-02）には効かないが、
  #   そのぶん実ユーザーを巻き込まない。
  # ⚠ robots.txt だけは読ませる（方針を読めない状態にはしない）—— Exa まで。
  # ⚠⚠ Meta は robots.txt も含めて一切通さない（2026-09-21 ユーザー判断・pooza/chubo2#118）。
  #   理由は実効性ではなく Meta への不信なので、「当たっていないから外す」はしない。
  # ⚠⚠ facebookexternalua は入れない。Threads の連合（POST /inbox・GET /actor）の UA で、
  #   塞ぐと Threads からの配送だけが 403 になる（2026-09-20〜21 に実際にそうなっていた）。
  #   連合は切らない（利用者がいる・2026-09-21 ユーザー判断）。
  if ($http_user_agent ~* "(facebookexternalhit|meta-externalagent|meta-webindexer|FacebookBot)") {
    return 403;
  }
  set $deny_ua 0;
  if ($http_user_agent ~* "ExaSearchBot") {
    set $deny_ua 1;
  }
  if ($request_uri ~ "^/robots\.txt") {
    set $deny_ua 0;
  }
  if ($deny_ua) {
    return 403;
  }

  location / {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location ~ ^/api/v[0-9]+/(statuses|media)$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/api/v1/statuses/[0-9]+/(favourite|reblog|bookmark)$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/api/v[0-9]+/media/[0-9]+$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $media_put_backend;
  }
  location ~ ^/api/v[0-9]+/statuses/[0-9]+$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    if ($status_put_backend = reject) {
      return 405;
    }
    proxy_pass $status_put_backend;
  }
  location ^~ /api/v1/streaming {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:4000;
  }
  location ^~ /mulukhiya/sidekiq {
    allow 2001:f70:37e0:5f00::/64; # 自宅・seas (IPv6)
    allow 192.168.100.0/24;        # オフィス LAN (IPv4)
    allow 116.91.103.40;           # ヘアピン NAT (IPv4)
    deny all;
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3008;
  }
  location ^~ /mulukhiya {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3008;
  }
  location ^~ /sidekiq {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location ^~ /nodeinfo {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/(packs|system|assets|emoji)/ {
    root /home/mastodon/repos/mastodon/public;
  }
  location = /custom.css {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location = /manifest.json {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location ~ \.(js|json|css|map)$ {
    add_header Cache-Control "public, max-age=0";
    root /home/mastodon/repos/mastodon/public;
  }
  location ~ \.(html|jpg|png|gif|mp4|xml|ico|svg|txt|ogg|mp3)$ {
    root /home/mastodon/repos/mastodon/public;
  }

  location ^~ /media {
    rewrite ^/media/(.*) https://bshockdon.ap-south-1.linodeobjects.com/$1 redirect;
  }
  location ^~ /accounts {
    proxy_set_header Host bshockdon.ap-south-1.linodeobjects.com;
    proxy_pass https://bshockdon.ap-south-1.linodeobjects.com;
  }
  location ^~ /media_attachments {
    proxy_set_header Host bshockdon.ap-south-1.linodeobjects.com;
    proxy_pass https://bshockdon.ap-south-1.linodeobjects.com;
  }
  location ^~ /preview_cards {
    proxy_set_header Host bshockdon.ap-south-1.linodeobjects.com;
    proxy_pass https://bshockdon.ap-south-1.linodeobjects.com;
  }
  location ^~ /site_uploads {
    proxy_set_header Host bshockdon.ap-south-1.linodeobjects.com;
    proxy_pass https://bshockdon.ap-south-1.linodeobjects.com;
  }
  location ^~ /custom_emojis {
    proxy_set_header Host bshockdon.ap-south-1.linodeobjects.com;
    proxy_pass https://bshockdon.ap-south-1.linodeobjects.com;
  }
  location ^~ /cache {
    proxy_set_header Host bshockdon.ap-south-1.linodeobjects.com;
    proxy_pass https://bshockdon.ap-south-1.linodeobjects.com;
  }

  location =/api/dic/v1/service.json {
    return 302 https://script.google.com/macros/s/AKfycbzoWxsXGU0wHQRohJka60hQ5D0FV7Dwx0SufijehDkGFRz9zyte5wUPPVMvmYYvNHf3bw/exec;
  }
  location =/api/dic/v1/common.json {
    return 302 https://script.google.com/macros/s/AKfycbx4NFYCozyhVFy-QkPWD3iDqhXZIPK_niMqA_EFoL06b3GJovv6weqfjdkCf3Sa1VDa/exec;
  }
  location = /contact {
    return 302 https://tally.so/r/nreMoM;
  }

  error_page 500 501 502 504 /500.html;
  error_page 503 @maintenance;

  location @maintenance {
    root /home/mastodon/repos/mastodon/public;
    try_files /maintenance.html =503;
  }

  if (-e /tmp/maintenance) {
    return 503;
  }
  if (-e /tmp/mstdn.b-shock.org) {
    return 503;
  }
}
