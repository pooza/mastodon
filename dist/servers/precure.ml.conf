server {
  listen 80;
  listen [::]:80;
  server_name precure.ml;
  access_log syslog:server=localhost,tag=nginx_curesta,severity=info combined;

  location /.well-known/acme-challenge/ {
    root /usr/local/www/mastodon/public;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name precure.ml;
  access_log syslog:server=localhost,tag=nginx_curesta,severity=info combined;

  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_certificate /usr/local/etc/letsencrypt/live/precure.ml/fullchain.pem;
  ssl_certificate_key /usr/local/etc/letsencrypt/live/precure.ml/privkey.pem;
  add_header Strict-Transport-Security max-age=63072000;

  location / {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://localhost:3000;
  }

  location ~ ^/api/v[0-9]+/(statuses|media)$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/api/v1/statuses/[0-9]+/(favourite|reblog|bookmark)$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/api/v[0-9]+/media/[0-9]+$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $media_put_backend;
  }
  location ~ ^/api/v[0-9]+/statuses/[0-9]+$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    if ($http_x_mulukhiya_purpose != '') {
      proxy_pass http://localhost:3008;
    }
    if ($status_put_backend = reject) {
      return 405;
    }
    proxy_pass $status_put_backend;
  }

  location ^~ /api/v1/streaming {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://localhost:4000;
  }
  location ^~ /mulukhiya/sidekiq {
    allow 2001:f70:37e0:5f00::/64; # 自宅・seas (IPv6)
    allow 192.168.100.0/24;        # オフィス LAN (IPv4)
    allow 116.91.103.40;           # ヘアピン NAT (IPv4)
    deny all;
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://localhost:3008;
  }
  location ^~ /mulukhiya {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://localhost:3008;
  }
  location ^~ /makoto/sidekiq {
    allow 2001:f70:2580:4d00::/64; #seas
    allow 116.91.103.40; #seas
    deny all;
    proxy_pass http://localhost:3011;
  }
  location ^~ /makoto {
    proxy_pass http://localhost:3011;
  }
  location ^~ /nodeinfo {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ^~ /sidekiq {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://localhost:3000;
  }
  location ~ ^/(packs|system|assets|emoji)/ {
    root /usr/local/www/mastodon/public;
  }
  location = /custom.css {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://localhost:3000;
  }
  location = /manifest.json {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://localhost:3000;
  }
  location ~ \.(js|json|css|map)$ {
    add_header Cache-Control "public, max-age=0";
    root /usr/local/www/mastodon/public;
  }
  location ~ \.(html|jpg|png|gif|mp4|xml|ico|svg|txt|ogg|mp3)$ {
    root /usr/local/www/mastodon/public;
  }

  location ^~ /media {
    rewrite ^/media/(.*) https://curesta.ap-south-1.linodeobjects.com/$1 redirect;
  }
  location ^~ /accounts {
    proxy_set_header Host curesta.ap-south-1.linodeobjects.com;
    proxy_pass https://curesta.ap-south-1.linodeobjects.com;
  }
  location ^~ /media_attachments {
    proxy_set_header Host curesta.ap-south-1.linodeobjects.com;
    proxy_pass https://curesta.ap-south-1.linodeobjects.com;
  }
  location ^~ /preview_cards {
    proxy_set_header Host curesta.ap-south-1.linodeobjects.com;
    proxy_pass https://curesta.ap-south-1.linodeobjects.com;
  }
  location ^~ /site_uploads {
    proxy_set_header Host curesta.ap-south-1.linodeobjects.com;
    proxy_pass https://curesta.ap-south-1.linodeobjects.com;
  }
  location ^~ /custom_emojis {
    proxy_set_header Host curesta.ap-south-1.linodeobjects.com;
    proxy_pass https://curesta.ap-south-1.linodeobjects.com;
  }
  location ^~ /cache {
    proxy_set_header Host curesta.ap-south-1.linodeobjects.com;
    proxy_pass https://curesta.ap-south-1.linodeobjects.com;
  }

  location = /api/v1/timelines/public {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    if ($arg_local !~* ^(true|t|1|on)$) {
      proxy_pass http://localhost:3000;
    }
    if ($arg_local ~* ^(true|t|1|on)$) {
      return 302 /api/v1/timelines/tag/precure_fun?max_id=$arg_max_id;
    }
  }

  location =/api/dic/v1/precure.json {
    return 302 https://script.google.com/macros/s/AKfycbwjEOZM0ceSVx61adzDcDopT4gmYKrWXShG25Smi9N9Ho8MDfS_KVzZXVFfG6CdXNY9iA/exec;
  }
  location =/api/dic/v1/dic.json {
    return 302 https://script.google.com/macros/s/AKfycbxtvmWF3SorOsucrqLkeldzIepfqRAdIedQMB-kXabnYDcrGoecqr8u2iGI61xieu-j0A/exec?action=dic;
  }
  location =/api/dic/v1/pron.json {
    return 302 https://script.google.com/macros/s/AKfycbxtvmWF3SorOsucrqLkeldzIepfqRAdIedQMB-kXabnYDcrGoecqr8u2iGI61xieu-j0A/exec?action=pron;
  }
  location =/api/dic/v1/common.json {
    return 302 https://script.google.com/macros/s/AKfycbxu6mOJMSvpezHvaMQEpWRyQNQJMHTj3Oz4Tb35zBaCISgdIJ10Mo7FW9v0BzD4BTpeow/exec;
  }
  location =/api/dic/v1/fairy.json {
    return 302 https://script.google.com/macros/s/AKfycbx8tPs-dz5pHKEFN66mXOJKEggf6u7Tbrr9Y9MuTb5nSmD15vX_I2e84E3fHLw3DvQO-Q/exec;
  }
  location =/api/dic/v2/fairy.json {
    return 302 https://script.google.com/macros/s/AKfycbyfo04hbk80Z5JYn9s0GqJuUk33YpbKv1JmYeg-ATdCMQCMq4FWh-GkMcoFInBnc3nKhw/exec;
  }
  location =/api/dic/v1/series.json {
    return 302 https://script.google.com/macros/s/AKfycbxdqh2CNk71V4-5vsiQ0ruEzF9Eu79pzDFyJiQa_GjgSYk9yCTrSo2lGi0wkiGsX_fU/exec;
  }
  location =/api/dic/v1/singer.json {
    return 302 https://script.google.com/macros/s/AKfycbyIAUFf0BqmO2xAMQYCC-hZf4Nn8uxgjcqv41xvkv08GPBINbg3Iysc-PoKe9MHKdN4/exec;
  }
  location =/api/dic/v1/emoji.json {
    return 302 https://script.google.com/macros/s/AKfycbw9RoEh1419QvZ_t_W0G7fBAR2AyRWK39vz4NHhJhB0KVIJNPV_uvLImuyKPBD9AKE-Uw/exec;
  }
  location =/api/program/v1/common.json {
    return 302 https://precure.ml/mulukhiya/api/program;
  }
  location =/feed/v1.0/tag/precure_fun {
    return 301 https://precure.ml/mulukhiya/feed/tag/precure_fun;
  }
  location = /contact {
    return 302 https://tally.so/r/nreMoM;
  }

  error_page 500 501 502 504 /500.html;
  error_page 503 @maintenance;

  location @maintenance {
    root /usr/local/www/mastodon/public;
    try_files /maintenance.html =503;
  }

  if (-e /tmp/maintenance) {
    return 503;
  }
  if (-e /tmp/precure.ml) {
    return 503;
  }
}
