server {
  listen 80;
  listen [::]:80;
  server_name cure-api.precure.ml;
  access_log syslog:server=localhost,tag=nginx_cureapi,severity=info combined;
  location /.well-known/acme-challenge/ {
    root /usr/local/www/nginx;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cure-api.precure.ml;
  access_log syslog:server=localhost,tag=nginx_cureapi,severity=info combined;

  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_certificate /usr/local/etc/letsencrypt/live/precure.ml/fullchain.pem;
  ssl_certificate_key /usr/local/etc/letsencrypt/live/precure.ml/privkey.pem;
  add_header Strict-Transport-Security max-age=63072000;

  proxy_set_header Host $host;

  location / {
    proxy_pass http://localhost:3009;
  }
}
