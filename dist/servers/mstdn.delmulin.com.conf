server {
  listen 80;
  listen [::]:80;
  server_name mstdn.delmulin.com;
  access_log syslog:server=localhost,tag=nginx_mstdn,severity=info combined;

  location /.well-known/acme-challenge/ {
    root /home/mastodon/repos/mastodon/public;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mstdn.delmulin.com;
  access_log syslog:server=localhost,tag=nginx_mstdn,severity=info combined;

  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_certificate /usr/local/etc/letsencrypt/live/mstdn.delmulin.com/fullchain.pem;
  ssl_certificate_key /usr/local/etc/letsencrypt/live/mstdn.delmulin.com/privkey.pem;
  add_header Strict-Transport-Security max-age=63072000;

  location / {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location ~ ^/api/v[0-9]+/(statuses|media)$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/api/v1/statuses/[0-9]+/(favourite|reblog|bookmark)$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/api/v[0-9]+/media/[0-9]+$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $media_put_backend;
  }
  location ~ ^/api/v[0-9]+/statuses/[0-9]+$ {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    if ($http_x_mulukhiya_purpose != '') {
      proxy_pass http://127.0.0.1:3008;
    }
    if ($status_put_backend = reject) {
      return 405;
    }
    proxy_pass $status_put_backend;
  }
  location ^~ /api/v1/streaming {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:4000;
  }
  location ^~ /mulukhiya/sidekiq {
    allow 2001:f70:37e0:5f00::/64; # 自宅・seas (IPv6)
    allow 192.168.100.0/24;        # オフィス LAN (IPv4)
    allow 116.91.103.40;           # ヘアピン NAT (IPv4)
    deny all;
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3008;
  }
  location ^~ /mulukhiya {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3008;
  }
  location ^~ /sidekiq {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location ^~ /nodeinfo {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass $mulukhiya_backend;
  }
  location ~ ^/(packs|system|assets|emoji)/ {
    root /home/mastodon/repos/mastodon/public;
  }
  location = /custom.css {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location = /manifest.json {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
  location ~ \.(js|json|css|map)$ {
    add_header Cache-Control "public, max-age=0";
    root /home/mastodon/repos/mastodon/public;
  }
  location ~ \.(html|jpg|png|gif|mp4|xml|ico|svg|txt|ogg|mp3)$ {
    root /home/mastodon/repos/mastodon/public;
  }

  location ^~ /media {
    rewrite ^/media/(.*) https://delmulin.ap-south-1.linodeobjects.com/$1 redirect;
  }
  location ^~ /accounts {
    proxy_set_header Host delmulin.ap-south-1.linodeobjects.com;
    proxy_pass https://demulin.ap-south-1.linodeobjects.com;
  }
  location ^~ /media_attachments {
    proxy_set_header Host delmulin.ap-south-1.linodeobjects.com;
    proxy_pass https://demulin.ap-south-1.linodeobjects.com;
  }
  location ^~ /preview_cards {
    proxy_set_header Host delmulin.ap-south-1.linodeobjects.com;
    proxy_pass https://demulin.ap-south-1.linodeobjects.com;
  }
  location ^~ /site_uploads {
    proxy_set_header Host delmulin.ap-south-1.linodeobjects.com;
    proxy_pass https://demulin.ap-south-1.linodeobjects.com;
  }
  location ^~ /custom_emojis {
    proxy_set_header Host delmulin.ap-south-1.linodeobjects.com;
    proxy_pass https://demulin.ap-south-1.linodeobjects.com;
  }
  location ^~ /cache {
    proxy_set_header Host delmulin.ap-south-1.linodeobjects.com;
    proxy_pass https://demulin.ap-south-1.linodeobjects.com;
  }

  location = /api/v1/timelines/public {
    include /usr/local/etc/nginx/mulukhiya_proxy.conf;
    if ($arg_local !~* ^(true|t|on|1)$) {
      proxy_pass http://127.0.0.1:3000;
    }
    if ($arg_local ~* ^(true|t|on|1)$) {
      return 302 /api/v1/timelines/tag/delmulin?max_id=$arg_max_id;
    }
  }

  location =/api/dic/v1/common.json {
    return 302 https://script.google.com/macros/s/AKfycbwkj9MyOcOA8_YYTN96MYq4hCHJ3iOVlRNvpkcwFNpuQ0WHSM1v_jb-HckVXgMSiR6D/exec?action=tags;
  }
  location =/api/dic/v1/pronunciations.json {
    return 302 https://script.google.com/macros/s/AKfycbwkj9MyOcOA8_YYTN96MYq4hCHJ3iOVlRNvpkcwFNpuQ0WHSM1v_jb-HckVXgMSiR6D/exec?action=pron;
  }
  location =/api/dic/v1/pron.json {
    return 302 https://script.google.com/macros/s/AKfycbwkj9MyOcOA8_YYTN96MYq4hCHJ3iOVlRNvpkcwFNpuQ0WHSM1v_jb-HckVXgMSiR6D/exec?action=pron;
  }
  location =/api/dic/v1/pronruby.json {
    return 302 https://script.google.com/macros/s/AKfycbwkj9MyOcOA8_YYTN96MYq4hCHJ3iOVlRNvpkcwFNpuQ0WHSM1v_jb-HckVXgMSiR6D/exec?action=pronruby;
  }
  location =/api/dic/v1/emoji.json {
    return 302 https://script.google.com/macros/s/AKfycbxXt73nNsHZ5gUtc0WQEu9xR4zuwmfaDiwEObbOUBSokWyi-qCEVkLlEjPTe-iSvAKPmQ/exec;
  }
  location =/api/character/v1/common.json {
    return 302 https://script.google.com/macros/s/AKfycbwJftzvIsTVJbZbXE3Qf7g1eSrYNwkoKzZRDX0OfIM-4HHbLffrJbcJ7A8P-CI_yigC_Q/exec;
  }
  location =/api/character/v1/detail.json {
    return 302 https://script.google.com/macros/s/AKfycbwJftzvIsTVJbZbXE3Qf7g1eSrYNwkoKzZRDX0OfIM-4HHbLffrJbcJ7A8P-CI_yigC_Q/exec?m=multi_field;
  }
  location =/api/numbering_title/v1/common.json {
    return 302 https://script.google.com/macros/s/AKfycbyQzjPIOWPzcEYe2Y1FuMJw719xxTXv3S0hDRhWwHSfaPguPZJY9MDRWuZ8NU0uWHFLnQ/exec;
  }
  location =/api/program/v1/common.json {
    return 302 https://mstdn.delmulin.com/mulukhiya/api/program;
  }
  location = /contact {
    return 302 https://tally.so/r/nreMoM;
  }

  error_page 500 501 502 504 /500.html;
  error_page 503 @maintenance;

  location @maintenance {
    root /home/mastodon/repos/mastodon/public;
    try_files /maintenance.html =503;
  }

  if (-e /tmp/maintenance) {
    return 503;
  }
  if (-e /tmp/mstdn.delmulin.com) {
    return 503;
  }
}
