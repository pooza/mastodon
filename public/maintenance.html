<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>メンテナンス中 - Mastodon</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                   "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #191b22;
      color: #d9e1e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .dialog {
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 32rem;
    }
    .dialog img {
      max-width: 80%;
      height: auto;
    }
    .dialog h1 {
      font-size: 1.5rem;
      margin: 1.5rem 0 0.75rem;
    }
    .dialog p {
      font-size: 1rem;
      line-height: 1.6;
      color: #9baec8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="dialog">
    <img src="/oops.png" alt="Mastodon">
    <h1>メンテナンス中です</h1>
    <p>ただいまメンテナンスのため一時的にサービスを停止しています。<br>しばらくしてから再度アクセスしてください。</p>
  </div>
</body>
</html>
